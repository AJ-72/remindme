# D18: Backup carries the new fields
# Tests that when reminders are backed up via Android Auto Backup,
# all new fields (from recent features) are preserved and restored correctly.
#
# AUTO: fully scriptable - validates JSON field presence after restore
# Requires: export via system backup, then verification of JSON structure
#
# Note: This requires integration with Android's Backup framework:
# 1. Create reminders with all current fields
# 2. Trigger backup via: adb shell bmgr backupnow
# 3. Reinstall the app
# 4. Verify exported reminders JSON contains all fields
#
appId: com.curios.remindme
---
# Setup: launch app
# NOTE: clearState:true fails on this device with a SecurityException
# (PID does not have permission CLEAR_APP_USER_DATA) - confirmed 2026-09-04.
- launchApp
- extendedWaitUntil:
    visible:
      id: "quick-add-input"
    timeout: 15000

# Create a reminder with various fields
- tapOn:
    id: "quick-add-input"
- inputText: "Test backup reminder at 3:00 PM"
- tapOn:
    id: "quick-add-save"
- waitForAnimationToEnd
# List accumulates across runs (no working clearState - see note above)
# and is sorted by upcoming time, with the scroll distance growing each
# run - scrollUntilVisible searches as far as needed.
- scrollUntilVisible:
    element:
      text: "Test backup reminder"
    direction: DOWN
    timeout: 10000

# Go to Settings and tap "Back up reminders" - this calls Share.share()
# which opens the native Android share sheet, not an in-app screen.
# testID is "backup-row", visible label is "Back up reminders".
# The row is below the fold (Settings has grown past one viewport since
# Smart Alerts was added - see settings.tsx comment), so scroll first.
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-scroll"
    timeout: 10000
- scroll
- assertVisible:
    id: "backup-row"
- tapOn:
    id: "backup-row"

# The native OS share sheet that opens next is outside the app's view
# hierarchy and outside Maestro's control - it can't be reliably asserted
# on or dismissed from here (varies by OS/launcher). Stop here.
#
# The actual field-preservation verification happens outside Maestro:
# 1. Pick "Copy" (or a file target) from the share sheet, or use
#    `adb shell dumpsys clipboard` / read the shared file
# 2. Parse the JSON and check all current Reminder fields are present
# 3. Verify new fields didn't get stripped during export
